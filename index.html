<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hiking Routes Interactive Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    .mapboxgl-popup {
      max-width: 320px;
    }
    .popup-card {
      padding: 6px 2px;
    }
    .popup-card h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #1a252f;
      border-bottom: 2px solid #27ae60; /* Fallback color */
      padding-bottom: 4px;
    }
    .popup-card p {
      margin: 4px 0;
      font-size: 13px;
      color: #4a5568;
    }
    .popup-card strong {
      color: #1a202c;
    }
    .stars {
      color: #f39c12;
      font-size: 15px;
      letter-spacing: 1px;
    }
    /* Lightweight hover tooltip styling */
    .hover-tooltip .mapboxgl-popup-content {
      padding: 6px 10px;
      background: rgba(26, 37, 47, 0.9);
      color: #ffffff;
      border-radius: 4px;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .hover-tooltip .mapboxgl-popup-tip {
      border-top-color: rgba(26, 37, 47, 0.9);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibmV3aXNsYW5kMTIyMyIsImEiOiJjbXY4MTVsY3cwOGxkMndzaGRkbGhpcjdrIn0.kZygV1BczpM3SFq1kgH-jw';
    const STYLE_URL = 'mapbox://styles/newisland1223/clzig8nrs00l501qqa3yxfgzm'; 
    const TILESET_ID = 'mapbox://newisland1223.i2pbxfp2in9b';

    const sourceLayers = [
      'msar5x7sb6ageiuwgm68', // Po Chue Tam
      'rm877rg7d47z0ywb1se5', // Pak Kok Shan
      'rns1361ap874t3gk29jp', // Lo Fu Tau
      'd2gu0s5bx7nn08m211tb', // Tung Lung Chau
      'hxn093mao88w6duv6wqe', // Cloudy Hill
      '6kbu2tx7htwxhioi0kb9', // Mount Stenhouse
      '00q0v1dio4dph2082xrg', // Sam Shan Toi
      'lxcimnjf3ka0qoida7ob', // Kai Kung Leng
      '5pf1kdkow23yu619loqx', // Jardine's Lookout
      'e7a5fbdejjtacea2a6r2', // Kowloon Peak
      '1ccjeq6bht199syks60c', // Lantau Peak
      'mr7frwi5keuyfmk054nd', // Po Toi
      'lwjw4sk23vs18lz6qu33'  // Wutong Mountain
    ];

    // Helper function to map difficulty score to hex color matching Mapbox expression
    function getDifficultyColor(score) {
      const d = parseFloat(score);
      if (isNaN(d)) return '#27ae60';
      if (d <= 4) return '#27ae60'; // Easy (Green)
      if (d <= 5) return '#2ecc71'; // Mild Green
      if (d <= 6) return '#f1c40f'; // Moderate (Yellow)
      if (d <= 7) return '#e67e22'; // Hard (Orange)
      if (d <= 8) return '#e74c3c'; // Very Hard (Red)
      return '#c0392b';             // Extremely Hard (Dark Red)
    }

    // Helper function to convert difficulty score to 10-circle indicator
    function renderDifficultyStars(score) {
      const starRating = parseFloat(score);
      if (isNaN(starRating)) return 'N/A';

      const totalStars = 10;
      const fullStars = Math.floor(starRating);
      const emptyStars = totalStars - fullStars;

      let starsHTML = '●'.repeat(fullStars);
      starsHTML += '○'.repeat(Math.max(0, emptyStars));

      return `<span class="stars">${starsHTML}</span> ${starRating}/${totalStars}`;
    }

    const map = new mapboxgl.Map({
      container: 'map',
      style: STYLE_URL,
      center: [114.13, 22.36], // Center of Hong Kong
      zoom: 9.8                 // Fits full Hong Kong territory
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    const hoverPopup = new mapboxgl.Popup({
      closeButton: false,
      closeOnClick: false,
      className: 'hover-tooltip',
      offset: 12
    });

    map.on('load', () => {
      map.addSource('hiking-routes-source', {
        type: 'vector',
        url: TILESET_ID
      });

      const lineLayerIds = [];

      const difficultyColorExpression = [
        'interpolate',
        ['linear'],
        ['to-number', ['get', 'difficulty'], 1],
        4, '#27ae60',
        5, '#2ecc71',
        6, '#f1c40f',
        7, '#e67e22',
        8, '#e74c3c',
        9, '#c0392b'
      ];

      sourceLayers.forEach((layerName, index) => {
        const casingId = `route-casing-${index}`;
        const lineId = `route-line-${index}`;

        lineLayerIds.push(lineId);

        map.addLayer({
          id: casingId,
          type: 'line',
          source: 'hiking-routes-source',
          'source-layer': layerName,
          minzoom: 0,
          maxzoom: 22,
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#ffffff',
            'line-width': 7,
            'line-opacity': 0.9
          }
        });

        map.addLayer({
          id: lineId,
          type: 'line',
          source: 'hiking-routes-source',
          'source-layer': layerName,
          minzoom: 0,
          maxzoom: 22,
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': difficultyColorExpression,
            'line-width': 4.5
          }
        });
      });

      // --- Hover behavior ---
      lineLayerIds.forEach((layerId) => {
        map.on('mousemove', layerId, (e) => {
          map.getCanvas().style.cursor = 'pointer';

          if (e.features.length > 0) {
            const props = e.features[0].properties;
            const mountainName = props.name || 'Hiking Route';
            const difficultyDisplay = renderDifficultyStars(props.difficulty);

            hoverPopup
              .setLngLat(e.lngLat)
              .setHTML(`<strong>${mountainName}</strong><br/>Difficulty: ${difficultyDisplay}`)
              .addTo(map);
          }
        });

        map.on('mouseleave', layerId, () => {
          map.getCanvas().style.cursor = '';
          hoverPopup.remove();
        });
      });

      // --- Click behavior ---
      map.on('click', (e) => {
        const bbox = [
          [e.point.x - 5, e.point.y - 5],
          [e.point.x + 5, e.point.y + 5]
        ];
        const features = map.queryRenderedFeatures(bbox, { layers: lineLayerIds });

        if (!features.length) return;

        const props = features[0].properties;

        const mountainName = props.name || 'Hiking Route';
        const routeDistance = props.distance ? `${props.distance} km` : (props.length || 'N/A');
        const difficultyDisplay = renderDifficultyStars(props.difficulty);
        const routeDesc = props.desc || props.cmt || '';
        
        // Dynamically compute header underline color matching the route difficulty
        const routeColor = getDifficultyColor(props.difficulty);

        const popupHTML = `
          <div class="popup-card">
            <h3 style="border-bottom-color: ${routeColor};">${mountainName}</h3>
            <p><strong>Length:</strong> ${routeDistance}</p>
            <p><strong>Difficulty:</strong> ${difficultyDisplay}</p>
            ${routeDesc && routeDesc !== 'FINISH' ? `<p><strong>Details:</strong> ${routeDesc}</p>` : ''}
          </div>
        `;

        new mapboxgl.Popup({ offset: [0, -5] })
          .setLngLat(e.lngLat)
          .setHTML(popupHTML)
          .addTo(map);
      });
    });
  </script>
</body>
</html>
