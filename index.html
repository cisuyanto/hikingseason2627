<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hiking Routes Interactive Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    .mapboxgl-popup {
      max-width: 320px;
    }
    .popup-card {
      padding: 6px 2px;
    }
    .popup-card h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #1a252f;
      border-bottom: 2px solid #e74c3c;
      padding-bottom: 4px;
    }
    .popup-card p {
      margin: 4px 0;
      font-size: 13px;
      color: #4a5568;
    }
    .popup-card strong {
      color: #1a202c;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibmV3aXNsYW5kMTIyMyIsImEiOiJjbXY4MTVsY3cwOGxkMndzaGRkbGhpcjdrIn0.kZygV1BczpM3SFq1kgH-jw';
    const STYLE_URL = 'mapbox://styles/newisland1223/clzig8nrs00l501qqa3yxfgzm'; 

    const TILESET_ID = 'mapbox://newisland1223.t10b5wcv01bj';

    // Replace these strings with the exact 12 source layer names listed in your Mapbox Tileset details
    const sourceLayers = [
      'R11 - Tai O',
      'R1 - Pak Kok Hill',
      'R8 - Lo Fu Tau',
      'R4 - Tung Lung Chau',
      'R7 - Cloudy Hill',
      'R2 - Mount Stenhouse',
      'R6 - Sam Shan Toi',
      'R5 - Kai Kung Leng',
      'R12 - Jardines Lookout',
      'R10 - Kowloon Peak',
      'R9 - Lantau Peak',
      'R3 - Po Toi'
    ];

    const map = new mapboxgl.Map({
      container: 'map',
      style: STYLE_URL,
      center: [114.15, 22.28], // Adjust coordinates to your map region
      zoom: 11
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    map.on('load', () => {
      // 1. Add the main vector tileset source
      map.addSource('hiking-routes-source', {
        type: 'vector',
        url: TILESET_ID
      });

      // Collect layer IDs created for interactive event binding
      const lineLayerIds = [];

      // 2. Loop through all 12 source layers to add casing and line layers
      sourceLayers.forEach((layerName, index) => {
        const casingId = `route-casing-${index}`;
        const lineId = `route-line-${index}`;

        lineLayerIds.push(lineId);

        // White casing layer for high contrast
        map.addLayer({
          id: casingId,
          type: 'line',
          source: 'hiking-routes-source',
          'source-layer': layerName,
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#ffffff',
            'line-width': 6,
            'line-opacity': 0.85
          }
        });

        // Main line layer
        map.addLayer({
          id: lineId,
          type: 'line',
          source: 'hiking-routes-source',
          'source-layer': layerName,
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#e74c3c',
            'line-width': 3.5
          }
        });
      });

      // 3. Bind click popups across all 12 route line layers
      map.on('click', (e) => {
        // Query features specifically from our 12 route line layers under the click point
        const bbox = [
          [e.point.x - 5, e.point.y - 5],
          [e.point.x + 5, e.point.y + 5]
        ];
        const features = map.queryRenderedFeatures(bbox, { layers: lineLayerIds });

        if (!features.length) return;

        const props = features[0].properties;

        // Retrieve properties from your GPX dataset
        const mountainName = props.name || 'Unknown Mountain / Route';
        const routeDistance = props.distance || 'N/A';
        const routeDifficulty = props.difficulty || 'N/A';
        const routeDesc = props.desc || props.cmt || '';

        const popupHTML = `
          <div class="popup-card">
            <h3>${mountainName}</h3>
            <p><strong>Length:</strong> ${routeDistance}</p>
            <p><strong>Difficulty:</strong> ${routeDifficulty}</p>
            ${routeDesc ? `<p><strong>Details:</strong> ${routeDesc}</p>` : ''}
          </div>
        `;

        new mapboxgl.Popup({ offset: [0, -5] })
          .setLngLat(e.lngLat)
          .setHTML(popupHTML)
          .addTo(map);
      });

      // 4. Update cursor behavior when hovering over any route
      lineLayerIds.forEach((layerId) => {
        map.on('mouseenter', layerId, () => {
          map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', layerId, () => {
          map.getCanvas().style.cursor = '';
        });
      });
    });
  </script>
</body>
</html>
